<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEDx Space Odyssey - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Modal (shown by default) -->
    <div class="modal" id="loginModal">
        <div class="login-box glow">
            <h2 class="modal-title">TEDx SPACE ODYSSEY</h2>
            <input type="password" class="modal-input" id="passwordInput" placeholder="Enter Admin Password">
            <button class="modal-btn" id="loginBtn">LAUNCH DASHBOARD</button>
        </div>
    </div>

    <!-- Edit Attendee Modal -->
    <div class="modal" id="editModal" style="display: none;">
        <div class="edit-box glow">
            <h2 class="modal-title">EDIT ATTENDEE</h2>
            <input type="hidden" id="editId">
            <input type="text" class="modal-input" id="editName" placeholder="Full Name">
            <input type="text" class="modal-input" id="editPhone" placeholder="Phone Number">
            <input type="email" class="modal-input" id="editEmail" placeholder="Email">
            <input type="text" class="modal-input" id="editFaculty" placeholder="Faculty">
            <input type="text" class="modal-input" id="editGrade" placeholder="Grade">
            <input type="text" class="modal-input" id="editPromo" placeholder="Promo Code">
            <input type="text" class="modal-input" id="editTransaction" placeholder="Transaction Code">
            <select class="modal-input" id="editStatus">
                <option value="not_entered">Not Entered</option>
                <option value="entered">Entered</option>
            </select>
            <button class="modal-btn" id="saveEditBtn">SAVE CHANGES</button>
            <button class="modal-btn secondary" id="cancelEditBtn">CANCEL</button>
        </div>
    </div>

    <!-- Dashboard Content (hidden until login) -->
    <div id="dashboardContent" style="display: none;">
        <!-- Header -->
        <header class="dashboard-header">
            <text text-anchor="middle" style="color:#e50914; font-weight:900">TEDx</text>
            <h1 class="event-title">SPACE ODYSSEY DASHBOARD</h1>
            <div>
                <button id="logoutBtn" style="background: none; border: none; color: #ff5252; cursor: pointer;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="dashboard-content">
            <!-- Review Mode Content -->
            <div id="reviewModeContent">
                <!-- Stats Cards -->
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-value" id="totalAttendees">0</div>
                        <div class="stat-label">TOTAL REGISTERED</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="attendedCount">0</div>
                        <div class="stat-label">ATTENDED</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="remainingCount">0</div>
                        <div class="stat-label">REMAINING</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="latestRegistration">-</div>
                        <div class="stat-label">LATEST REGISTRATION</div>
                    </div>
                </div>

                <!-- Search and Filters -->
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search term...">
                    <select class="search-select" id="searchField">
                        <option value="name">Name</option>
                        <option value="phone">Phone</option>
                        <option value="email">Email</option>
                        <option value="promo">Promo Code</option>
                        <option value="transaction">Transaction Code</option>
                    </select>
                    <select class="search-select" id="statusFilter">
                        <option value="all">All Statuses</option>
                        <option value="entered">Attended</option>
                        <option value="not_entered">Not Attended</option>
                    </select>
                    <button class="search-btn" id="searchBtn">
                        <i class="fas fa-search"></i> SEARCH
                    </button>
                </div>

                <!-- Data Table -->
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>PHONE</th>
                            <th>EMAIL</th>
                            <th>PROMO CODE</th>
                            <th>TRANSACTION</th>
                            <th>STATUS</th>
                            <th>REGISTERED</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="attendeesTableBody">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>

                <!-- Export Button -->
                <div class="export-buttons">
                    <button class="export-btn" id="exportBtn">
                        <i class="fas fa-file-export"></i> EXPORT TO CSV
                    </button>
                    <button class="export-btn" id="exportXlsxBtn">
                        <i class="fas fa-file-excel"></i> EXPORT TO XLSX
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
